name: Check hosted Higgsfield connection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: higgsfield-worker
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install official CLI
        run: npm install --global @higgsfield/cli@0.1.40
      - name: Verify and preserve hosted session without spending
        env:
          HF_SESSION: ${{ secrets.HIGGSFIELD_SESSION }}
          STUDIO_WORKER_SECRET: ${{ secrets.STUDIO_WORKER_SECRET }}
        run: node scripts/hosted-check.mjs
      - name: Remove session
        if: always()
        run: rm -f "$HOME/.config/higgsfield/credentials.json"
